<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <link rel="stylesheet" href="/static/style.css?v=20261125-4">
</head>
<body>
    <div class="container">
        <h1>TikTok Downloader</h1>
        <div id="drop-zone" class="drop-zone">
            <p class="drop-text">Drop TikTok links here</p>
            <span class="or">or</span>
            <div class="input-row">
                <textarea id="url-input" rows="2" placeholder="Paste one or more TikTok links..." aria-label="TikTok links" spellcheck="false"></textarea>
                <button id="add-btn">Add</button>
            </div>
        </div>
        <div id="url-queue" class="url-queue" style="display:none;">
            <div class="queue-header">
                <span id="queue-count">0 links</span>
                <button id="clear-all-btn" class="clear-btn">Clear All</button>
            </div>
            <div id="queue-list" class="queue-list"></div>
        </div>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <div class="download-controls">
            <label for="start-number">Start number</label>
            <input id="start-number" type="number" min="1" max="2147483647" step="1" value="1" required>
            <button id="download-all-btn" class="download-all-btn" disabled>Download All</button>
        </div>
        <div id="batch-progress" class="batch-progress" style="display:none;">
            <div class="batch-status-text">
                <span id="batch-status-msg">Starting...</span>
                <span id="batch-counts"></span>
            </div>
            <div class="progress-wrap batch-bar"><div id="batch-bar" class="progress-bar"></div></div>
            <div class="batch-actions">
                <span id="connection-status" class="connection-status" role="status"></span>
                <div class="failed-actions">
                    <button id="open-downloads-btn" class="secondary-btn">Open downloads folder</button>
                    <button id="copy-failed-btn" class="secondary-btn" hidden>Copy failed links</button>
                    <a id="save-failed-btn" class="secondary-btn" hidden>Save failed links</a>
                    <button id="retry-failed-btn" class="secondary-btn" hidden>Retry failed</button>
                </div>
            </div>
        </div>
        <div id="task-list" class="task-list" aria-label="Download status"></div>
    </div>
    <script src="/static/script.js?v=20261125-5"></script>
</body>
</html>
