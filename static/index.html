<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>TikTok Downloader</h1>
        <div id="drop-zone" class="drop-zone">
            <p class="drop-text">Drop TikTok links here</p>
            <span class="or">or</span>
            <div class="input-row">
                <input type="url" id="url-input" placeholder="Paste TikTok URL..." autocomplete="off" />
                <button id="add-btn">Add</button>
            </div>
        </div>
        <div id="url-queue" class="url-queue" style="display:none;">
            <div class="queue-header">
                <span id="queue-count">0 links</span>
                <button id="clear-all-btn" class="clear-btn">Clear All</button>
            </div>
            <div id="queue-list" class="queue-list"></div>
        </div>
        <button id="download-all-btn" class="download-all-btn" disabled>Download All</button>
        <div id="batch-progress" class="batch-progress" style="display:none;">
            <div class="batch-status-text">
                <span id="batch-status-msg">Starting...</span>
                <span id="batch-counts"></span>
            </div>
            <div class="progress-wrap batch-bar"><div id="batch-bar" class="progress-bar"></div></div>
        </div>
        <div id="task-list" class="task-list"></div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
